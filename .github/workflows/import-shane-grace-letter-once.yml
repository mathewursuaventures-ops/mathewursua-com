name: Import signed Shane Grace letter once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-shane-grace-letter-once.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shane-grace-asset-import
  cancel-in-progress: false
jobs:
  import-verified-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact author-approved public PDF and verify checksum
        shell: bash
        env:
          SOURCE_ID: "1YVUIajzIRw-yOPgf277DM6LJ7w1ruqcN"
          DEST: "assets/public/letters/2026-11-17-shane-grace-photo-editor-open-letter.pdf"
          EXPECTED_SHA: "40f354c6aa4bc1216dc57933491ba3abe89f914a227747732007c0354acd185e"
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DEST")"
          urls=(
            "https://drive.usercontent.google.com/download?id=${SOURCE_ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=${SOURCE_ID}"
          )
          verified=0
          for url in "${urls[@]}"; do
            if curl -fLsS --retry 2 --max-time 40 -A "Mozilla/5.0" "$url" -o "$DEST"; then
              if printf '%s  %s\n' "$EXPECTED_SHA" "$DEST" | sha256sum --check --status; then
                verified=1
                break
              fi
            fi
          done
          if [ "$verified" != 1 ]; then
            echo "PDF content could not be verified; aborting without publishing." >&2
            exit 1
          fi
          echo "Exact source bytes SHA-256 verified."
      - name: Register direct-download archive without modifying visible pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          sitemap=root/'sitemap.xml'
          text=sitemap.read_text()
          url="https://mathewursua.com/assets/public/letters/2026-11-17-shane-grace-photo-editor-open-letter.pdf"
          if url not in text:
              assert '</urlset>' in text
              sitemap.write_text(text.replace('</urlset>', '  <url><loc>'+url+'</loc></url>\n</urlset>'))
          check_file=root/'.github/scripts/site_preflight.py'
          check=check_file.read_text()
          old="check('sitemap only published canonicals',urls==list(canonicals.values()),str(urls))"
          new="public_letter_url=\"https://mathewursua.com/assets/public/letters/2026-11-17-shane-grace-photo-editor-open-letter.pdf\"\npublic_letter_path=ROOT/\"assets/public/letters/2026-11-17-shane-grace-photo-editor-open-letter.pdf\"\ncheck('sitemap canonical pages plus approved public PDF',urls==list(canonicals.values())+[public_letter_url],str(urls))\ncheck('public Grace letter exists and matches verified SHA-256',public_letter_path.is_file() and hashlib.sha256(public_letter_path.read_bytes()).hexdigest()==\"40f354c6aa4bc1216dc57933491ba3abe89f914a227747732007c0354acd185e\",str(public_letter_path))"
          assert old in check, 'Unexpected site preflight changed: refuse to modify.'
          check_file.write_text(check.replace(old,new.replace('\n','\n ')))
          pub=root/'assets/public'
          pub.mkdir(parents=True,exist_ok=True)
          (pub/'README.md').write_text('''# Public asset downloads
          
          This directory holds stable, directly downloadable public files (letters, headshots, documents).
          Files are **not linked from the website navigation or visible HTML pages**.
          Approved assets may be explicitly included in the root `/sitemap.xml` for search-engine discovery.
          Publishing here does **not** make files private. Do not store sensitive documents in this directory.
          
          Rules:
          - Use lowercase descriptive hyphenated filenames with a date for historical documents.
          - Keep original published files at the same path; publish revised editions at new paths.
          - Preserve existing website pages and metadata when adding assets.
          - Include indexable files in the root sitemap and keep the preflight allowlist in sync.
          - Never remove a long-lived URL without a migration and external reference audit.
          
          First asset: `letters/2026-11-17-shane-grace-photo-editor-open-letter.pdf`
          Author: Mathew Ursua; document date: November 17, 2026.
          Source: the signed letter shared from Google Drive by its author.
          SHA-256: 40f354c6aa4bc1216dc57933491ba3abe89f914a227747732007c0354acd185e
          ''')
          print('Updated root sitemap and site-quality guard; registered public asset policy')
          
          PY
      - name: Run existing website quality gate with new asset checks
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check beautifulsoup4 pillow
          python3 .github/scripts/site_preflight.py
      - name: Commit only PDF, archive policy, sitemap, and preflight update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/public/letters/2026-11-17-shane-grace-photo-editor-open-letter.pdf" assets/public/README.md sitemap.xml .github/scripts/site_preflight.py
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "assets: archive signed Shane Grace letter with sitemap validation"
          git push origin HEAD:main
